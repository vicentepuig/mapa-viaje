<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Monki Viaje 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F2F2F7;
  --card:      #FFFFFF;
  --primary:   #000000;
  --secondary: #6C6C70;
  --tertiary:  #AEAEB2;
  --sep:       rgba(60,60,67,.12);
  --flight:    #0A84FF;
  --train:     #34C759;
  --pass-hdr:  #1C1C1E;
  --r:         16px;
  --r-sm:      10px;
  --shadow:    0 1px 4px rgba(0,0,0,.08), 0 0 0 0.5px rgba(0,0,0,.04);
}

html { background: var(--bg); }

body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--primary);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100dvh;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 32px);
}

/* ── Header ─────────────────────────────────────────────────────────────────── */
#header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(242,242,247,.85);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 13px;
  border-bottom: 0.5px solid var(--sep);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.hdr-title { font-size: 1rem; font-weight: 700; letter-spacing: -.02em; color: var(--primary); }
.hdr-date  { font-size: .68rem; font-weight: 500; color: var(--secondary); white-space: nowrap; }

/* ── Sections ───────────────────────────────────────────────────────────────── */
.section { padding: 28px 16px 8px; }
.section-label {
  font-size: .6rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--secondary);
  margin-bottom: 10px; padding: 0 4px;
}

/* ── Itinerary timeline ─────────────────────────────────────────────────────── */
.itin-list { display: flex; flex-direction: column; gap: 4px; }

/* City card */
.city-card {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .15s;
  overflow: hidden;
}
.city-card:active { opacity: .7; }
.city-card-head {
  padding: 16px 16px 18px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.cc-left  { flex: 1; min-width: 0; }
.cc-right { flex-shrink: 0; text-align: right; }
.cc-name    { font-size: 1.1rem; font-weight: 700; letter-spacing: -.02em; line-height: 1; color: var(--primary); }
.cc-country { font-size: .62rem; font-weight: 500; color: var(--secondary); margin-top: 3px; }
.cc-stay    { font-size: .7rem; color: var(--secondary); margin-top: 8px; line-height: 1.3; }
.cc-stay svg { vertical-align: middle; margin-top: -1px; }
.cc-date    { font-size: .72rem; font-weight: 600; color: var(--primary); line-height: 1.2; }
.cc-dur     { font-size: .6rem; color: var(--tertiary); margin-top: 3px; }
.cc-badges  { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 11px; }

/* Transport connector between cards */
.tc-block {
  display: flex; justify-content: center; align-items: center;
  padding: 10px 20px;
}
.tc-route  { font-size: .68rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.tc-line-flight { color: var(--primary); }
.tc-line-train  { color: #AC7F5E; }

/* ── Badges ─────────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; font-size: .6rem; font-weight: 600;
  border-radius: 100px;
}
.badge-flight  { background: rgba(0,0,0,.07);          color: var(--primary);  }
.badge-train   { background: rgba(172,127,94,.13);    color: #AC7F5E;         }
.badge-stay    { background: rgba(0,0,0,.07);          color: var(--primary);  }
.badge-transit { background: rgba(0,0,0,.05);          color: var(--secondary); }

/* ── Document passes — flip cards ───────────────────────────────────────────── */
.doc-passes { display: flex; flex-direction: column; gap: 14px; }

/* Flip wrapper */
.pass-wrap {
  perspective: 1400px;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.pass-inner {
  position: relative;
  transform-style: preserve-3d;
  transition: transform .58s cubic-bezier(.4,0,.2,1);
  border-radius: var(--r);
}
.pass-inner.flipped { transform: rotateY(180deg); }

/* Both faces share base styles */
.pass-face {
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

/* Front face — dark card, sized by JS to match back height */
.pass-face-front {
  position: absolute; inset: 0;
  background: var(--pass-hdr);
  display: flex; flex-direction: column; justify-content: flex-start;
  padding: 22px 18px 20px;
}
.pass-face-front .pass-hint {
  position: absolute; top: 14px; right: 16px;
  font-size: .58rem; font-weight: 600; color: rgba(255,255,255,.3);
  letter-spacing: .04em;
}
/* Large centered icon in remaining space */
.pass-front-icon {
  flex: 1; display: flex; align-items: center; justify-content: center;
  margin-top: 4px; opacity: .13;
}

/* Back face — white, natural height (sets container height) */
.pass-face-back {
  transform: rotateY(180deg);
  background: var(--card);
  cursor: default;
}
/* Tap back to close */
.pass-back-hint {
  text-align: center; font-size: .6rem; font-weight: 600;
  color: var(--tertiary); padding: 0 0 14px; letter-spacing: .03em;
}

/* Shared pass content styles (used on both faces) */
.pass {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* Pass header */
.pass-hdr {
  background: var(--pass-hdr);
  padding: 16px 18px 15px;
  border-radius: var(--r) var(--r) 0 0;
}
.pass-type  { font-size: .55rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 5px; }
.pass-route { font-size: 1.08rem; font-weight: 700; color: #FFFFFF; letter-spacing: -.015em; line-height: 1.15; }
.pass-sub   { font-size: .67rem; color: rgba(255,255,255,.45); margin-top: 5px; }

/* Dashed perforation */
.pass-sep {
  position: relative; height: 1px;
  background: none;
  border-top: 1px dashed var(--sep);
  margin: 0 18px;
}

/* Pass body */
.pass-body { padding: 14px 18px; }
.pass-row  {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 10px;
  padding: 8px 0; border-bottom: 0.5px solid var(--sep);
}
.pass-row:last-child { border-bottom: none; }
.pr-name { font-size: .8rem; font-weight: 600; color: var(--primary); }
.pr-meta { font-size: .62rem; color: var(--secondary); text-align: left; margin-top: 3px; line-height: 1.5; }
.pass-field-row { display: flex; gap: 0; padding: 10px 0 6px; }
.pf { flex: 1; }
.pf-label { font-size: .55rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tertiary); margin-bottom: 3px; }
.pf-val   { font-size: .82rem; font-weight: 700; color: var(--primary); }

/* Pass actions */
.pass-actions {
  padding: 10px 18px 16px;
  border-top: 0.5px solid var(--sep);
  display: flex; gap: 8px; flex-wrap: wrap;
}
.pass-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,.05); border: none;
  border-radius: var(--r-sm);
  padding: 7px 14px;
  font-size: .67rem; font-weight: 600; color: var(--primary);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s;
  cursor: pointer; font-family: inherit;
}
.pass-btn:active { background: rgba(0,0,0,.1); }

/* Insurance */
.ins-pax-row { padding: 8px 0; border-bottom: 0.5px solid var(--sep); }
.ins-pax-row:last-child { border-bottom: none; }
.ins-pax-name { font-size: .8rem; font-weight: 600; color: var(--primary); }
.ins-pax-meta { font-size: .63rem; color: var(--secondary); line-height: 1.6; margin-top: 2px; }
.ins-emerg {
  background: rgba(10,132,255,.06); border-radius: var(--r-sm);
  padding: 10px 12px; margin-top: 12px;
}
.ins-emerg-label { font-size: .55rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--flight); margin-bottom: 5px; }
.ins-emerg-line  { font-size: .72rem; color: var(--primary); line-height: 1.6; }

/* ── Sheet ──────────────────────────────────────────────────────────────────── */
#sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0);
  z-index: 200; display: none; transition: background .25s;
}
#sheet-backdrop.visible { background: rgba(0,0,0,.3); }

#sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 210;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 16px);
  max-height: 88dvh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.32,.72,0,1);
  touch-action: pan-y;
  box-shadow: 0 -4px 30px rgba(0,0,0,.12);
}
#sheet.open { transform: translateY(0); }
#sheet-handle-area {
  position: sticky; top: 0; background: var(--card); z-index: 1;
  display: flex; justify-content: center; padding: 12px 0 6px; cursor: pointer;
  border-radius: 20px 20px 0 0;
}
#sheet-handle { width: 36px; height: 4px; background: var(--sep); border-radius: 100px; }
#sheet-body { padding: 4px 20px 30px; }

/* Sheet contents */
.sh-city    { font-size: 1.3rem; font-weight: 700; letter-spacing: -.025em; color: var(--primary); }
.sh-country { font-size: .7rem; color: var(--secondary); margin-top: 3px; margin-bottom: 16px; }
.divider    { height: 0.5px; background: var(--sep); margin: 12px 0; }
.sh-label   { font-size: .58rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--secondary); margin-bottom: 8px; }
.sh-dates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sh-date-block .tag  { font-size: .58rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--tertiary); margin-bottom: 3px; }
.sh-date-block .val  { font-size: .85rem; font-weight: 600; color: var(--primary); }
.sh-date-block .time { font-size: .7rem; color: var(--secondary); margin-top: 2px; }
.tr-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--sep); }
.tr-row:last-child { border-bottom: none; }
.tr-body { flex: 1; }
.tr-name   { font-size: .82rem; font-weight: 600; color: var(--primary); }
.tr-detail { font-size: .7rem; color: var(--secondary); margin-top: 3px; line-height: 1.4; }
.tr-head   { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sh-pax    { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.sh-pax-row {
  background: var(--bg); border-radius: var(--r-sm);
  padding: 8px 12px;
}
.sp-name  { font-size: .74rem; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
.sp-field { display: flex; justify-content: space-between; margin-top: 3px; }
.sp-label { font-size: .57rem; font-weight: 600; color: var(--tertiary); letter-spacing: .05em; text-transform: uppercase; }
.sp-val   { font-size: .67rem; color: var(--primary); font-variant-numeric: tabular-nums; }
.notes-box {
  background: var(--bg); border-radius: var(--r-sm);
  padding: 10px 12px;
}
.notes-box p { font-size: .76rem; color: var(--secondary); line-height: 1.55; }
.sh-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
.pdf-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .62rem; font-weight: 600; color: var(--flight);
  background: rgba(10,132,255,.08); border: none;
  border-radius: var(--r-sm); padding: 3px 9px;
  text-decoration: none; flex-shrink: 0;
  transition: background .12s;
}
.pdf-btn:active { background: rgba(10,132,255,.15); }
.pdf-btn[data-type="train"]         { color: var(--train); background: rgba(52,199,89,.08); }
.pdf-btn[data-type="train"]:active  { background: rgba(52,199,89,.15); }
</style>
</head>

function makePass(frontContent, backContent, iconHtml = BIG_FLIGHT, hdrColor = null) {
  const wrap  = document.createElement('div');  wrap.className = 'pass-wrap';
  const inner = document.createElement('div');  inner.className = 'pass-inner';

  const front = document.createElement('div');
  front.className = 'pass-face pass-face-front';
  if (hdrColor) front.style.background = hdrColor;
  front.innerHTML = `
    <span class="pass-hint">Toca para ver más</span>
    ${frontContent}
    <div class="pass-front-icon">${iconHtml}</div>`;

  const back  = document.createElement('div');
  back.className  = 'pass-face pass-face-back';
  // Apply header color to back face header too
  const coloredBack = hdrColor
    ? backContent.replace('<div class="pass-hdr">', `<div class="pass-hdr" style="background:${hdrColor}">`)
    : backContent;
  back.innerHTML  = coloredBack + `<div class="pass-back-hint">Toca para cerrar</div>`;

  inner.appendChild(front);
  inner.appendChild(back);
  wrap.appendChild(inner);

  wrap.addEventListener('click', e => {
    if (inner.classList.contains('flipped') && e.target.closest('a, button')) return;
    inner.classList.toggle('flipped');
  });

  return wrap;
}

        <div class="sp-name">${p.name}</div>
        <div class="sp-field"><span class="sp-label">Reserva</span><span class="sp-val">${p.reserva}</span></div>
        <div class="sp-field"><span class="sp-label">Billete</span><span class="sp-val">${p.billete}</span></div>
        <div class="sp-field"><span class="sp-label">Maleta</span><span class="sp-val">${p.maleta}</span></div>
        ${p.ff ? `<div class="sp-field"><span class="sp-label">FF</span><span class="sp-val">${p.ff}</span></div>` : ''}
      </div>`).join('');
    return `
      <div class="tr-row">
        <div style="flex-shrink:0;margin-top:1px;color:#341A02">${t.type==='flight'?IC.flight:IC.train}</div>
        <div class="tr-body">
          <div class="tr-head">
            <div class="tr-name">${t.name}</div>
            ${pdfBtns ? `<div style="display:flex;gap:4px">${pdfBtns}</div>` : ''}
          </div>
          <div class="tr-detail">${t.detail.replace(/\n/g,'<br>')}</div>
          ${paxRows ? `<div class="sh-pax">${paxRows}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const staySection = stop.stayLabel ? `
    <div class="divider"></div>
    <div class="sh-label">Alojamiento</div>
    <div style="font-size:.8rem;line-height:1.5;white-space:pre-line">${stop.stay}</div>` : '';

  const badges = stop.badges.map(b => {
    const { cls, icon, label } = badgeMap[b];
    const lbl = b==='stay' ? (stop.stayLabel||'Alojamiento') : label;
    return `<span class="badge ${cls}">${icon}${lbl}</span>`;
  }).join('');

  sheetBody.innerHTML = `
    <div class="sh-city">${city.name}</div>
    <div class="sh-country">${city.country}</div>
    <div class="divider"></div>
    <div class="sh-label">Fechas</div>
    ${datesHTML}
    ${staySection}
    <div class="divider"></div>
    <div class="sh-label">Transporte</div>
    ${transportHTML}
    <div class="divider"></div>
    <div class="sh-label">Notas</div>
    <div class="notes-box"><p>${stop.notes}</p></div>
    <div class="sh-badges">${badges}</div>`;

  backdrop.style.display = 'block';
  requestAnimationFrame(() => { backdrop.classList.add('visible'); sheet.classList.add('open'); });
}

function closeSheet() {
  sheet.classList.remove('open');
  backdrop.classList.remove('visible');
  setTimeout(() => { backdrop.style.display = 'none'; }, 300);
}

let sheetStartY = 0;
sheet.addEventListener('touchstart', e => { sheetStartY = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener('touchmove',  e => { if (e.touches[0].clientY - sheetStartY > 60) closeSheet(); }, { passive: true });

// ── Flip card — sync front face height to back face ───────────────────────────
function syncFlipHeights() {
  document.querySelectorAll('.pass-wrap').forEach(wrap => {
    const back  = wrap.querySelector('.pass-face-back');
    const inner = wrap.querySelector('.pass-inner');
    const h = back.offsetHeight;
    inner.style.height = h + 'px';
  });
}
requestAnimationFrame(() => requestAnimationFrame(syncFlipHeights));
window.addEventListener('resize', syncFlipHeights);
</script>
</body>
</html>
